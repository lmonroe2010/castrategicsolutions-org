<!-- @dsCard group="Components" height=200 subtitle="Default, focus, select and error states" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Input</title></head>
<body>
<div class="ssi-stage" style="display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;padding:20px 28px">
  <div class="ssi-field"><label class="ssi-field__label">Email address</label><input class="ssi-input" type="email" placeholder="you@example.org" value="luke@castrategicsolutions.org"></div>
  <div class="ssi-field"><label class="ssi-field__label">First name</label><input class="ssi-input is-focus" type="text" value="Jamie"><div class="ssi-field__helper">Focused state</div></div>
  <div class="ssi-field"><label class="ssi-field__label">I'm reaching out about</label><select class="ssi-select"><option>Partnership Opportunity</option></select></div>
  <div class="ssi-field"><label class="ssi-field__label">Phone</label><input class="ssi-input is-error" type="tel" value="707-331"><div class="ssi-field__helper is-error">Please enter a complete phone number</div></div>
</div>
</body></html>
