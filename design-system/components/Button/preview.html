<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="ssi-stage" style="display:grid;grid-template-columns:1fr 1fr;gap:22px 24px;align-items:center">
  <div style="display:flex;flex-direction:column;gap:10px"><div class="ssi-note">PRIMARY</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="ssi-btn ssi-btn--primary">Apply for a Grant</button><button class="ssi-btn ssi-btn--primary is-hover">Hover</button></div></div>
  <div style="display:flex;flex-direction:column;gap:10px"><div class="ssi-note">ACCENT CTA</div><div><button class="ssi-btn ssi-btn--accent">Donate Today</button></div></div>
  <div style="display:flex;flex-direction:column;gap:10px"><div class="ssi-note">SECONDARY</div><div><button class="ssi-btn ssi-btn--secondary">Learn More</button></div></div>
  <div style="display:flex;flex-direction:column;gap:10px"><div class="ssi-note">GHOST</div><div><button class="ssi-btn ssi-btn--ghost">Read the report →</button></div></div>
  <div style="display:flex;flex-direction:column;gap:10px"><div class="ssi-note">SMALL</div><div style="display:flex;gap:10px"><button class="ssi-btn ssi-btn--primary ssi-btn--sm">Contact</button><button class="ssi-btn ssi-btn--secondary ssi-btn--sm">Save</button></div></div>
  <div style="display:flex;flex-direction:column;gap:10px"><div class="ssi-note">DISABLED</div><div><button class="ssi-btn ssi-btn--primary" disabled>Submitted</button></div></div>
</div>
</body></html>
