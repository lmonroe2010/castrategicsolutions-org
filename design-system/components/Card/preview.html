<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Card</title></head>
<body>
<div class="ssi-stage" style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
  <div class="ssi-card">
    <div class="ssi-card__rule"></div>
    <div class="ssi-card__pct">50%</div>
    <h3 class="ssi-card__title">Community Grants</h3>
    <div class="ssi-card__desc">Half of all funds granted to local nonprofits across Sonoma County.</div>
  </div>
  <div class="ssi-card">
    <div class="ssi-card__amount">$15,000</div>
    <div class="ssi-card__recipient">The Healthy Room Project</div>
    <div class="ssi-card__blurb">Seed funding to open the inaugural Sonoma County branch, concentrating on unincorporated West County.</div>
  </div>
</div>
</body></html>
